<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 집 장보기</title>
<style>
  :root {
    --bg: #f6f3ec;
    --paper: #ffffff;
    --ink: #222428;
    --muted: #7a7d84;
    --line: #e4e0d6;
    --green: #2f9e5b;
    --green-soft: #e3f4ea;
    --orange: #e8772e;
    --orange-soft: #fdeee2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    padding: 28px 16px 48px;
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  header {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 14px; margin-bottom: 20px;
  }
  h1 { margin: 0; font-size: 28px; letter-spacing: -0.5px; }
  .progress { color: var(--muted); font-weight: 600; margin-top: 4px; }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 8px; width: 220px; max-width: 100%; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--green); transition: width .25s; }
  #done {
    font: inherit; font-weight: 700; font-size: 16px;
    background: var(--ink); color: #fff; border: 0; border-radius: 12px;
    padding: 12px 20px; cursor: pointer;
  }
  #done:hover { opacity: .85; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
  section {
    background: var(--paper); border: 1px solid var(--line); border-radius: 18px;
    padding: 18px 18px 14px;
  }
  section h2 { margin: 0 0 2px; font-size: 19px; display: flex; align-items: center; gap: 8px; }
  section h2 small { font-size: 13px; color: var(--muted); font-weight: 600; margin-left: auto; }
  .desc { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
  form { display: flex; gap: 8px; margin-bottom: 10px; }
  form input {
    flex: 1; min-width: 0; font: inherit; font-size: 15px;
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #fcfbf8;
  }
  form input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  form button {
    font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 0 14px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  #regular { --accent: var(--green); --soft: var(--green-soft); }
  #once    { --accent: var(--orange); --soft: var(--orange-soft); }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 6px; border-bottom: 1px dashed var(--line);
  }
  li:last-child { border-bottom: 0; }
  li label { flex: 1; display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 16px; }
  li input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; flex: none; }
  li.checked { background: var(--soft); border-radius: 8px; }
  li.checked .name { text-decoration: line-through; color: var(--muted); }
  .del {
    border: 0; background: none; color: var(--muted); font-size: 16px;
    cursor: pointer; padding: 4px 8px; border-radius: 6px;
  }
  .del:hover { background: #f1eee7; color: #c0392b; }
  .empty { color: var(--muted); font-size: 14px; padding: 14px 6px; text-align: center; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 99px;
    font-weight: 600; opacity: 0; transition: .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>🧺 우리 집 장보기</h1>
      <div class="progress" id="progress"></div>
      <div class="bar"><i id="bar"></i></div>
    </div>
    <button id="done">🧾 장보기 끝</button>
  </header>

  <div class="cols">
    <section id="regular">
      <h2>🔁 자주 사는 것 <small id="count-regular"></small></h2>
      <p class="desc">장보기 끝을 누르면 체크만 풀리고 다음에 또 써요.</p>
      <form data-list="regular"><input placeholder="예: 바나나" aria-label="자주 사는 것 추가"><button>추가</button></form>
      <ul></ul>
    </section>

    <section id="once">
      <h2>🛒 이번만 <small id="count-once"></small></h2>
      <p class="desc">장보기 끝을 누르면 체크한 품목은 사라져요.</p>
      <form data-list="once"><input placeholder="예: 생일 케이크" aria-label="이번만 추가"><button>추가</button></form>
      <ul></ul>
    </section>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  const KEY = "our-home-groceries-v1";
  const DEFAULT_REGULAR = ["우유", "계란", "두부", "대파", "양파", "쌀", "라면", "김치", "휴지", "주방세제"];

  let state = load();

  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem(KEY));
      if (saved && Array.isArray(saved.regular) && Array.isArray(saved.once)) return saved;
    } catch (e) {}
    return {
      regular: DEFAULT_REGULAR.map(name => ({ id: uid(), name, checked: false })),
      once: [],
    };
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function render() {
    for (const listName of ["regular", "once"]) {
      const ul = document.querySelector(`#${listName} ul`);
      const items = state[listName];
      ul.innerHTML = "";
      if (!items.length) {
        ul.innerHTML = `<li class="empty">아직 비어 있어요. 위에 적고 엔터!</li>`;
      }
      for (const item of items) {
        const li = document.createElement("li");
        if (item.checked) li.className = "checked";
        li.innerHTML = `<label><input type="checkbox"><span class="name"></span></label>
                        <button class="del" title="지우기" aria-label="지우기">✕</button>`;
        li.querySelector(".name").textContent = item.name;
        const cb = li.querySelector("input");
        cb.checked = item.checked;
        cb.addEventListener("change", () => { item.checked = cb.checked; commit(); });
        li.querySelector(".del").addEventListener("click", () => {
          state[listName] = state[listName].filter(x => x !== item);
          commit();
        });
        ul.appendChild(li);
      }
      const n = items.filter(x => x.checked).length;
      document.getElementById(`count-${listName}`).textContent = items.length ? `${n} / ${items.length}` : "";
    }
    const all = [...state.regular, ...state.once];
    const done = all.filter(x => x.checked).length;
    document.getElementById("progress").textContent =
      all.length ? `${all.length}개 중 ${done}개 담음` : "목록이 비어 있어요";
    document.getElementById("bar").style.width = all.length ? (done / all.length * 100) + "%" : "0";
  }

  function commit() { save(); render(); }

  document.querySelectorAll("form").forEach(form => {
    form.addEventListener("submit", e => {
      e.preventDefault();
      const input = form.querySelector("input");
      const name = input.value.trim();
      if (!name) return;
      const list = state[form.dataset.list];
      if (list.some(x => x.name === name)) { toast(`'${name}'은(는) 이미 있어요`); input.select(); return; }
      list.push({ id: uid(), name, checked: false });
      input.value = "";
      commit();
    });
  });

  document.getElementById("done").addEventListener("click", () => {
    const bought = [...state.regular, ...state.once].filter(x => x.checked).length;
    if (!bought) { toast("아직 체크한 품목이 없어요"); return; }
    if (!confirm("장보기를 마칠까요?\n\n• 자주 사는 것: 체크만 풀려요\n• 이번만: 체크한 품목은 지워져요")) return;
    state.regular.forEach(x => x.checked = false);
    state.once = state.once.filter(x => !x.checked);
    commit();
    toast("수고하셨어요! 목록을 정리했어요 🧾");
  });

  let toastTimer;
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2000);
  }

  render();
</script>
</body>
</html>
